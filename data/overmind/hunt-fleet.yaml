# Wildlife-hunt fleet — the wildlife-cull pool (pkg/worker/hunt.go).
#
# This file is read by an overmind started with it as its fleet config. Launch
# it as a deliberate act, and run the pre-flight (below) first.
#
# Hunting is the first standing behavior in this repo that deliberately takes
# fire, and the gates that keep it survivable (difficulty cap 1, wildlife-only)
# are only as good as the first fleet that runs under them. Grow the pool after
# a pass has been watched end to end.
#
# The gates are NOT configurable here on purpose: they are constants in
# pkg/worker/hunt_gate.go so that raising the fleet's risk posture is a code
# change with a review, not a yaml edit.
#
# `station` is the hunter's ammo depot and its rearm destination: the hunter
# keeps its ammo in its own storage there, provisions from it before a sortie
# and returns to it to rearm. A hunt pass docks wherever it already is to reach
# a mission board, travels to the quarry's own POI type, and stays out for the
# whole sortie.
#
# Optional agent fields, both left unset in this file (defaults apply):
#   hunt_ammo_cap  most credits one sortie may spend on ammunition from the
#                  market. Default 5000. A hunter never spends below a small
#                  credit floor kept for fuel and repair.
#   hunt_explore   exploration rates for the hunt decisions, comma-separated
#                  kind=epsilon with kind provision or return and epsilon 0 to
#                  1, for example "provision=0.15,return=0.05". Default empty,
#                  which means the rules decide every time.
# Decision records are written to data/agents/<agent>/hunt-decisions/. See
# docs/ops/hunt-refit-and-depot.md.
#
# PRE-FLIGHT, by hand, before this fleet is launched:
#   1. Refuel pirate-6 — its active Drillship was last seen at 0/130 and cannot
#      move. Confirm before assuming: the reading is from 2026-08-08.
#   2. DONE 2026-08-09: all five of pirate-6..10 are fitted with a
#      pulse_laser_i. The plan budgeted ~10,000cr to arm four of them; the
#      whole roster is armed, so the pool can grow past two without a
#      further weapons purchase when the operator chooses to.
#   3. Switch both agents into their Prospectors. The Drillships, Deeprock
#      Harvester and Excavator stay docked: they out-slot the Prospector but are
#      legacy hulls, and losing one costs more than this fleet earns.
#   4. Canary first_hunt_belt_grazers by hand through play_as before letting the
#      fleet run unattended.
#   5. Launch with --assets-db-path data/assets.db and --stagger 10s.
# GROWN TO FIVE 2026-08-10. The original two-agent start was a risk posture for a
# behaviour that had never run unattended, not a capability limit. Since then all
# five were canaried by hand through the full loop — accept, travel, engage,
# close, kill, complete — and every one finished First Hunt: Belt-Grazers at
# 100% hull. A grazer deals ~40 damage across a ~19-tick fight and shields
# absorb all of it. The five are identically fitted Prospectors with a
# pulse_laser_i, so there is nothing left that the first two would prove.
#
# Grounds: kochab_belt and ironpeak_belt (2 jumps from first_step) are the only
# nearby belts carrying Belt-Grazers, and both respawn. Khambalia is 10 jumps
# out and unnecessary. The hunt role finds its own ground; this is recorded for
# the operator.
workers:
  - { agent_id: pirate-6, role: hunt, station: frontier_station }
  - { agent_id: pirate-7, role: hunt, station: frontier_station }
  - { agent_id: pirate-8, role: hunt, station: frontier_station }
  - { agent_id: pirate-9, role: hunt, station: frontier_station }
  - { agent_id: pirate-10, role: hunt, station: frontier_station }

  # UNLOCK GRADUATES 2026-09-09 — pirate-1/5/13 banked the pirate unlock and were
  # idling in the unlock pool. Role follows the id prefix: pirate-* is `hunt`.
  # They are the ONLY unlocked agents in this fleet — pirate-6..10 are all still
  # pirate-locked, and hunt.go carries no stronghold guard, so these three are
  # currently the safest hunters on the roster.
  - { agent_id: pirate-1, role: hunt, station: frontier_station }
  - { agent_id: pirate-5, role: hunt, station: frontier_station }
  - { agent_id: pirate-13, role: hunt, station: frontier_station }
