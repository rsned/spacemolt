  # === THE NINE STRONGHOLD RESIDENTS (returned 2026-08-13) =================
  # ⚠️ PIN A `resident` WITH THE **POI ID**, NOT THE BASE ID. The two roles want
  # OPPOSITE halves of a dual-named station and there is no id that satisfies
  # both:
  #
  #   mission/unlock roles -> BASE id. atPinnedStation compares the pin against
  #     st.Player.DockedAtBase, resolving base<->POI through the KB.
  #   resident -> POI id. Its return leg travels to the pin id LITERALLY, and
  #     `voss_redoubt_station` never equals CurrentPOI `voss_redoubt`.
  #
  # Getting it wrong is not a no-op, because travel AUTO-UNDOCKS: the worker
  # undocks, flies to the POI it was already docked at, re-docks, and repeats
  # forever. Live 2026-08-13, ~50s per cycle. These nine were carried over from
  # unlock-fleet.yaml with their BASE-id pins intact and seven of them thrashed
  # immediately; only sable_port and korr_fortress -- pinned by POI id because
  # they are never-scanned warlord bases with no `bases` row to name -- sat still.
  # That is the same loop that drained alhena and sheratan to ZERO on 08-12,
  # reached from the other direction.
  - { agent_id: marketbot_algol, role: resident, station: dross_citadel }      # Algol / Dross Citadel — gas_cloud
  - { agent_id: marketbot_alhena, role: resident, station: voss_redoubt }      # Alhena / Voss Redoubt — NOTHING mineable; capture only
  - { agent_id: marketbot_barnard_44, role: resident, station: sable_port }            # Barnard 44 / Sable Port (unscanned) — asteroid_belt
