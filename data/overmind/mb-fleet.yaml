# Marketbots only (resident): idle-mine + scheduled update_market at the hour boundary.
#
# RETURNED 2026-08-13: algol, alhena, barnard_44, bellatrix, gliese_581,
# gsc_0008, sheratan, xamidimura, zaniah — the nine removed on 2026-06-26 as
# "tasked for stations they can't reach yet". They can reach them now. Each
# completed the pirate-unlock chain (`an_introduction`, baseline -30 -> 10) in
# the unlock fleet and is DOCKED at the warlord stronghold it is named for, so
# the reason for the exclusion is gone and the pins below are the campaign's
# output. Nine dark markets become reporting ones on the hourly update_market.
#
# All nine are plain `resident`, not the gas/ice variants, on purpose: the three
# share an identical capture schedule and differ ONLY in what the idle script
# harvests, and the ledger records module COUNTS, not names — so there is no way
# to tell from here which of these hulls (cobble, prospect, archimedes, theoria,
# threshold, maul) carries a gas or ice harvester. Capture is the point of the
# move; mining is the bonus. The mineable resource in each system is noted per
# line, so flip a role once you have confirmed the fitting.
workers:
  - { agent_id: marketbot_001, role: resident, station: "" }  # added 2026-07-11: resident at Hex Star (dheneb, player station); dheneb has a belt
  - { agent_id: marketbot_002, role: resident, station: "" }  # added 2026-07-31: resident at The Obsidian Well (arneb, player station); arneb has belt + gas + ice

  # === THE NINE STRONGHOLD RESIDENTS (returned 2026-08-13) =================
  # ⚠️ PIN A `resident` WITH THE **POI ID**, NOT THE BASE ID. The two roles want
  # OPPOSITE halves of a dual-named station and there is no id that satisfies
  # both:
  #
  #   mission/unlock roles -> BASE id. atPinnedStation compares the pin against
  #     st.Player.DockedAtBase, resolving base<->POI through the KB.
  #   resident -> POI id. Its return leg travels to the pin id LITERALLY, and
  #     `voss_redoubt_station` never equals CurrentPOI `voss_redoubt`.
  #
  # Getting it wrong is not a no-op, because travel AUTO-UNDOCKS: the worker
  # undocks, flies to the POI it was already docked at, re-docks, and repeats
  # forever. Live 2026-08-13, ~50s per cycle. These nine were carried over from
  # unlock-fleet.yaml with their BASE-id pins intact and seven of them thrashed
  # immediately; only sable_port and korr_fortress -- pinned by POI id because
  # they are never-scanned warlord bases with no `bases` row to name -- sat still.
  # That is the same loop that drained alhena and sheratan to ZERO on 08-12,
  # reached from the other direction.
  - { agent_id: marketbot_algol, role: resident, station: dross_citadel }      # Algol / Dross Citadel — gas_cloud
  - { agent_id: marketbot_alhena, role: resident, station: voss_redoubt }      # Alhena / Voss Redoubt — NOTHING mineable; capture only
  - { agent_id: marketbot_barnard_44, role: resident, station: sable_port }            # Barnard 44 / Sable Port (unscanned) — asteroid_belt
