  # failure of the CHAIN, not of routing or runway — which is exactly what makes
  # it the control against explorer-1 (15k, 1 jump) and explorer-2 (133k, 1 jump).
  - { agent_id: fighter-2, role: missionrunner, station: treasure_cache_trading_post, mission_categories: [delivery, exploration, smuggling], enable_freight: true }
  - { agent_id: fighter-3, role: missionrunner, station: "", mission_categories: [delivery, exploration] }
