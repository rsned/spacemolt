# Mission LEARNING pool — delivery + exploration categories.
#
# Expanded 2026-07-18 from the engineer-2 canary to the idle engineer/explorer/
# fighter/random families. Every worker runs the missionrunner role with
# mission_categories [delivery, exploration]: it takes delivery missions when its
# ship can carry the cargo (pre-accept availability gate) and exploration
# (pure-nav visit_system/dock_at_base) tours otherwise. Each dock leg fires a
# full market capture — paid coverage sweeps across the whole idle fleet.
#
# Combat/explorer ships with little cargo will lean on exploration missions;
# that is expected and fine. Launch the overmind with --stagger 10s (42 fresh
# logins pace under the per-IP /login limit). Boards are shared per empire
# region (agents pair 1-2/3-4/5-6/7-8), so co-located members that find no
# acceptable mission park via the dry-board backoff instead of burning fuel.
#
# Spec: docs/superpowers/specs/2026-07-17-exploration-missions-design.md
workers:
  # craftsman-1: TEMPORARY freight-tier grind (operator request 2026-07-22) —
  # 1100 cargo. Normally reserved for operator play_as (see craft-fleet.yaml).
  # HELD OUT via mission-learn-overrides.json since 2026-07-25: operator is using
  # it for PRODUCTION FACILITY work. Do NOT re-add without operator say-so.
  # engineer-2 likewise held out as the standing smuggling pilot.
  # MOVED TO THE HAUL FLEET 2026-08-15 (operator request) — see haul-fleet.yaml.
  # Left commented rather than deleted so the history stays readable. Do NOT
  # uncomment while it is a hauler: two fleets spawning one agent means a
  # double login and session_replaced thrash.
  # - { agent_id: craftsman-1, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 11 }
  - { agent_id: engineer-2, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  # SMUGGLING CANARY 1 of 2 (2026-07-26). Contraband couriers carry warnings
  # (insurance voided) and only these two workers are opted in. Chosen for the
  # biggest fuel reserves in the fleet, since the mission distance cap is now
  # lifted and the chain-1 route to smuggling L2 is a 17-jump cross-border run.
  # Pinned to grand_exchange_station 2026-07-27 to stop the roaming that hid a
  # 1338-tick red_mist courier while it idled at a board-less Dheneb POI.
  # REPINNED to treasure_cache_trading_post 2026-07-28: the canary has proven the
  # climb (smuggling L5), so the pin's job changes from "see couriers" to "reach
  # the chain giver". `an_introduction` — the pirate BASELINE unlock (-30 -> 10,
  # permanent stronghold docking) — is offered only by Dara Kesh at treasure_cache,
  # confirmed by its chain neighbours: across_the_line (chain_next=an_introduction)
  # and supply_run both sit at this base and nowhere else.
  # NOTE the runner cannot yet ACCEPT it: an_introduction carries TWO deliver_item
  # objectives and deliverShape() takes len(Objectives)==1 only, so it skips as
  # "not a plain deliver mission". The pin puts engineer-1 in position; the accept
  # still needs multi-objective support or a manual play_as run.
  - { agent_id: engineer-1, role: missionrunner, station: treasure_cache_trading_post, mission_categories: [delivery, exploration, smuggling], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-3, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-4, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  # engineer-5 was briefly pinned here as smuggling canary 3 on 2026-07-29 and
  # STRANDED ITSELF reaching the pin: its recovery dock landed at Hex Star, a POI
  # that sells no fuel, the refuel failed `no_fuel_source` (the server reports it
  # as "insufficient credits" even with 702k), and the worker departed on the
  # 16-jump route anyway with 135 fuel against its own 128 estimate. The estimate
  # is optimistic — fuel scales with hull and distance, not a flat 8/jump — so it
  # ran dry at Alula, a star with no station. Reverted to roaming; the canary
  # moved to explorer-12, which is 3 jumps from the giver instead of 16.
  # LESSON: pick a canary for REACHABILITY and FUEL, not for credits — money you
  # cannot spend where you are standing buys nothing.
  - { agent_id: engineer-5, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-6, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-7, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-8, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-9, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
  - { agent_id: engineer-10, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 6 }
