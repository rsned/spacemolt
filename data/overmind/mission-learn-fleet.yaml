  # Wave 3 (same day): explorer-9 fugue 135 -> 1, explorer-10 cobble 175 -> 1,
  # explorer-11 dirk 210 -> 2, explorer-12 empirica 495 -> 4.
  # Wave 4 (same day): explorer-6 threshold 265 -> 2. ALL 12 explorers now carry
  # freight; none remain parked in mission-learn-overrides.json.
  # SMUGGLING CANARY 4 (2026-07-29). THIN-WALLET replication of explorer-12's
  # from-zero run: 15,135 credits is within a rounding error of the 15,953 that
  # explorer-12 started chain 1 on, so if this one starves where that one did not,
  # the difference is not the wallet. 1 jump from the giver, 420 cargo.
  # explorer-1 MOVED to haul-fleet 2026-08-12 as the stronghold-arbitrage
  # canary: it holds the unlock and flies a 420-cargo Floor Price at 1
  # fuel/jump. Return it here if the stronghold lane does not pay.
  # SMUGGLING CANARY 5 (2026-07-29). MID-WALLET arm: 133,308 credits, 340 cargo,
  # 1 jump out. Sits between explorer-1's 15k and fighter-2's 1.55M so the three
  # new arms bracket the credit axis at one jump-distance.
  - { agent_id: explorer-2, role: missionrunner, station: treasure_cache_trading_post, mission_categories: [delivery, exploration, smuggling], enable_freight: true, freight_max_packages: 3 }
  - { agent_id: explorer-3, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 9 }
  - { agent_id: explorer-4, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 4 }
  - { agent_id: explorer-5, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 3 }
  - { agent_id: explorer-6, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 2 }
  - { agent_id: explorer-7, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 2 }
  - { agent_id: explorer-8, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 4 }
  - { agent_id: explorer-9, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 1 }
  - { agent_id: explorer-10, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 1 }
  - { agent_id: explorer-11, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true, freight_max_packages: 2 }
  # SMUGGLING CANARY 2 of 2 — see engineer-1 above. Pinned alongside it: this one
  # had drifted to Alpha Centauri and logged ZERO smuggling sightings there.
  # REPINNED to the chain giver 2026-07-29 as the from-zero canary. engineer-1
  # proved the route to the pirate-baseline unlock but started at smuggling L2,
  # so the climb from level 0 has never been run. explorer-12 is L0 and, more to
  # the point, sits 3 jumps from treasure_cache with 275 fuel — the constraint
  # that actually strands a canary is reachability, not the wallet (see the
  # engineer-5 note above). Its thin credits only bite in the later courier
  # grind, which is observable before it matters.
  # Route: a_word_in_private (dock_at_base, +50 XP -> L1) -> no_questions_asked
  # -> across_the_line -> couriers to L3 -> an_introduction -> baseline -30 -> 10.
  - { agent_id: explorer-12, role: missionrunner, station: treasure_cache_trading_post, mission_categories: [delivery, exploration, smuggling], enable_freight: true, freight_max_packages: 4 }
  - { agent_id: fighter-1, role: missionrunner, station: "", mission_categories: [delivery, exploration], enable_freight: true }
  # SMUGGLING CANARY 3 (2026-07-29) — the ZERO-RISK arm, and the one to read first.
  # It was ALREADY docked at treasure_cache_trading_post when the canary set was
  # chosen (0 jumps) with 1,545,295 credits, so it cannot repeat engineer-5's
