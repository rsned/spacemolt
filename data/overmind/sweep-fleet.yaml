  # Round 2 "bottom pass" (2026-11-14): the 148°→48° arc swept at 50 LY spacing in round 1,
  # re-run at 150 LY spacing over 7200-8550 LY (option C); span widened to a full 360° lap 2026-11-14 08:xx (user: double-check nothing was missed in or out of band).
  # Round-1 states archived in data/sweep-archive/round1-20261114/.
  # Round 1 (2026-11-13). Re-spaced 10:15 to 100 LY (capture radius ~100 LY per dev;
