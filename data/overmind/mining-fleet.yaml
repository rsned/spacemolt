# Mining fleet — the pirate-unlock campaign's graduation destination.
#
# Created 2026-08-21. There was no mining fleet before this: data/overmind/fleet.yaml
# is the dead Plan-A monolith (it still lists miner-1..10 alongside explorers and
# haulers that have since moved to live fleets), and starting IT would double-run
# ~30 agents under a second session — the `session_replaced` thrash. This roster is
# the mining fleet; fleet.yaml stays unrun.
#
# Everyone here has BANKED THE PIRATE UNLOCK (baseline 10 on all nine pirate
# factions). They finished the unlock chain and then kept churning the unlock
# board with nothing left to win — johnny_cab's 47-hour livelock was the same
# waste, found the same day. The unlock pool has no graduation step of its own,
# so releasing a graduate is a manual move: comment it out of unlock-fleet.yaml,
# add it here, SIGHUP the unlock overmind, and this fleet picks it up.
#
# The `miner` role gained its idle script (idle_mine) in the same change — before
# that it ran captures only, so a "miner" did not mine.
workers:
  # Mining hulls, mining 12.
  - { agent_id: miner-1, role: miner, station: "" }
  - { agent_id: miner-4, role: miner, station: "" }
  - { agent_id: miner-9, role: miner, station: "" }
  - { agent_id: miner-10, role: miner, station: "" }

  # Not miner-named, but same profile: mining 12 on starter hulls. Moved here
  # rather than parked idle — an idle agent still pays property tax on its ship
  # and drains toward the 0-credit bounty spiral.
  - { agent_id: overmind, role: miner, station: "" }
  - { agent_id: prophet-2, role: miner, station: "" }

  # mining skill 0, but starter ships ship WITH a mining laser, so the loop runs.
  - { agent_id: random-clark, role: miner, station: "" }

  # ---------------------------------------------------------------------------
  # CRYSTAL SQUAD 2026-08-25 — 16 mining hulls moved out of mission-learn to mine
  # energy_crystal for the drone refit (3,607 short). Every one of these carries a
  # per-agent data/agents/<id>/scripts/idle_mine.smolt that overrides the shared
  # script; read one before changing anything here.
  #
  # WHY THE OVERRIDE EXISTS: the shared idle_mine travels to $ASTEROID_BELT$, and
  # every high-share energy_crystal site in the survey is a NEBULA. Left on the
  # default script these 16 would mine the wrong rock and return no crystals.
  #
  # WHY role: miner AND NOT a new role name: StallTimeoutFor keys the 6x miner
  # stall window off the literal string "miner". A `crystal_miner` role would fall
  # back to the 15-minute window and the watchdog would kill them mid-pass — the
  # exact bug fixed in ad3f4488. The role must stay "miner"; the per-agent script
  # is what differs.
  #
  # Squad A -> forgotten_prism (ivorygate), ~24% crystal share, pool 5,000,
  # home bd20_2457 (3 jumps, MEASURED fuel desk). Combined hold 1,550.
  - { agent_id: fighter-5, role: miner, station: "" }
  - { agent_id: fighter-6, role: miner, station: "" }
  - { agent_id: fighter-7, role: miner, station: "" }
  - { agent_id: fighter-9, role: miner, station: "" }
  - { agent_id: random-1, role: miner, station: "" }
  - { agent_id: random-2, role: miner, station: "" }
  - { agent_id: random-3, role: miner, station: "" }
  - { agent_id: random-4, role: miner, station: "" }
  - { agent_id: random-5, role: miner, station: "" }
  - { agent_id: random-6, role: miner, station: "" }
  - { agent_id: random-8, role: miner, station: "" }
  - { agent_id: random-9, role: miner, station: "" }

  # Squad B -> wanderers_veil (struve_1321), ~33% share but pool only 444, home
  # cargo_lanes (6 jumps, MEASURED). Split off Squad A so one field is not drawn
  # to the floor. NOT homed at zaniah/mera_sanctum, which is 5 jumps and measured
  # but is our worst kill zone (6 combat deaths) and these agents hold no pirate
  # unlock. Combined hold 350.
  - { agent_id: fighter-2, role: miner, station: "" }
  - { agent_id: fighter-8, role: miner, station: "" }
  - { agent_id: fighter-10, role: miner, station: "" }
  - { agent_id: random-npc, role: miner, station: "" }
