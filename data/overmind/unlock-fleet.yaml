  # WHY THE ENGINEER-5 FEAR DOES NOT APPLY TO THEM. That strand was a big hull:
  # 135 fuel needed against a 128 tank, so the origin top-up could not cover the
  # route and the autopilot departed anyway. Every one of these seven flies a
  # scale-1 starter hull, where jump fuel = ceil(scale^1.5 x speed) = speed, so
  # 1-2 per jump against a 95-130 tank. Measured 2026-08-12 (assets.db hulls,
  # catalog_ships base_speed, jump counts by BFS over knowledge.db connections,
  # validated against the server's own find_route):
  #
  #   bellatrix    Theoria     1/jump  tank 100  16 jumps =  16   margin 84
  #   zaniah       Theoria     1/jump  tank 100  16 jumps =  16   margin 84
  #   algol        Cobble      2/jump  tank 120  16 jumps =  32   margin 88
  #   barnard_44   Archimedes  2/jump  tank 130  16 jumps =  32   margin 98
  #   xamidimura   Cobble      2/jump  tank 120  18 jumps =  36   margin 84
  #   gliese_581   Threshold   1/jump  tank  95  24 jumps =  24   margin 71
  #   gsc_0008     Maul        2/jump  tank 100  27 jumps =  54   margin 46
  #
  # The tightest of them still arrives with 46 fuel to spare, and all seven are
  # docked at fuel-selling stations right now, so the origin top-up lands. The
  # distance tail that made wave 2 unpinnable is a hull property, not a jump
  # count — these hulls are simply not in that risk class.
  # UNLOCKED 2026-08-12 20:39-21:16 — all seven completed `an_introduction`, whose
  # completion text is the grant itself: "You now have enough standing with the
  # pirate network to dock at their strongholds freely." (chain_next is
  # `supply_run`, the paying work that follows.)
  #
  # WHAT THE MISSION ACTUALLY CHANGES: the pirate BASELINE, and it is bimodal.
  # Across all 151 agents in assets.db there are exactly two values — -30 for the
  # 133 still locked, and 10 for the 18 who hold it. Nothing sits in between, so
  # `baseline >= 10` (smugglingUnlocked) is an exact test, not a threshold guess.
  # Reputation is NOT the signal: it reads 10-11 either way. Do not sample only
  # unlocked agents when checking this — every one of them shows 10/10 and the
  # difference disappears.
  #
  # So they are re-pinned from the giver's station to their OWN stronghold, the
  # posting the whole campaign was for. Base ids where the bases table knows them.
  # sable_port and korr_fortress are pinned by POI id because they are two of the
  # four warlord bases NEVER SCANNED — no bases row exists to name, which is
  # exactly the case atPinnedStation's CurrentPOI check was added to survive.
  # GRADUATED 2026-08-13 -> mb-fleet.yaml, all seven. Each is docked at its
  # stronghold holding baseline 10; the campaign's goal for them is met, so they
  # go back to the fleet they were pulled from, now able to reach the posting
  # mb-fleet.yaml had listed them as "tasked for stations they can't reach yet".
  #
  # The pins travel WITH them — the station ids are the campaign's hard-won
  # output, including the two POI-id pins for the never-scanned warlord bases.

