# Pirate-reputation UNLOCK pool (role `unlock`, data/overmind/roles.yaml).
#
# GOAL: get every agent to pirate baseline 10. Every agent starts at -30, the
# only hostile default in the game: it cannot dock at a stronghold and is
# attacked on sight. Completing smuggling chain 2 mission 1 (`an_introduction`,
# granted by Dara Kesh at treasure_cache_trading_post) raises the BASELINE to 10
# permanently. 7 of 122 agents hold it; the other 115 are still attackable.
#
# This file replaces idle-fleet.yaml (2026-08-11). That pool existed to make
# unpooled agents visible to the asset ledger and spent nothing. The membership
# is unchanged apart from the exclusions below; the role is not. `unlock` still
# carries the full capture schedule, so the observability the idle fleet was
# built for is preserved — these agents now also work toward the unlock.
#
# LAUNCH: --assets-db-path data/assets.db and --stagger 10s (34 fresh logins
# pace under the per-IP /login limit).
#
# ---------------------------------------------------------------------------
# WHY ONLY FOUR WORKERS ARE PINNED
#
# The whole chain is sold from ONE base. `across_the_line` and `supply_run` sit
# at treasure_cache_trading_post and nowhere else, and `an_introduction` is
# offered only by its giver there. So every agent must eventually stand at that
# base — but `station:` is a standing order to GO THERE NOW, and the autopilot
# cannot survive an arbitrarily long trip:
#
#   - it tops the tank off at the ORIGIN station, then departs even when its own
#     estimate says the route needs more fuel than the tank holds (it prints
#     "WARNING: Not enough fuel!" and jumps anyway);
#   - mid-route it only burns cargo fuel_cells (autopilotRefuelIfNeeded, <10%).
#     It never docks to buy fuel between hops. These hulls carry no fuel cells.
#
# That is exactly how engineer-5 stranded on 2026-07-29: a 16-jump pin, 135 fuel
# against its own 128 estimate, dry at Alula — a star with no station. Measured
# 2026-08-11 against data/spacemolt-knowledge.db, the distances from here to the
# giver are 3, 4, 13, 14, 16, 17, 24 and 26 jumps. Pinning the far tail would
# repeat engineer-5 twenty times over.
#
# So: wave 1 is pinned, everything else runs UNPINNED. An unpinned worker takes
# local delivery/exploration missions, which is what the 40-worker mission-learn
# pool has done for weeks — it earns credits and fuel discipline in place, which
# is what wave 2 needs before it can be moved. Promoting a worker to wave 1 is a
# one-line edit once it is staged within a few jumps of the giver.
#
# ---------------------------------------------------------------------------
# A THIN WALLET IS NOT A BLOCKER HERE — THE CHAIN SUPPLIES ITS OWN CARGO
#
# The nine stronghold marketbots held between 89 and 489 credits when this pool
# was written (checkpoint.db, 2026-06-26), and that was fine even then. The
# mission provider hands the goods over on accept: every deliver_item
# leg in this chain arrives fully stocked via ProvidedItems, so BuyQty is 0 and
# the agent purchases nothing. The runner will not even attempt the other shape
# — a smuggling mission that tells you to source the contraband yourself is a
# HARD REJECT at selection (mission_select.go), because contraband has no sell
# orders on any market and such a run could never be completed.
#
# So a thin wallet pays for FUEL and nothing else, which is why alhena and
# sheratan were pinned at 3 jumps rather than parked: the trip is short and the
# chain that follows is free. If either does run dry, miner-2 sits in the same
# system (Haven) with 895,145 credits; send_gift needs the sender DOCKED and
# takes the recipient's game USERNAME, not its agent_id.
#
# It worked, and the wallets are no longer thin either. Measured 2026-08-12 in
# data/assets.db: alhena and sheratan both hold the unlock (smuggling 8, pirate
# baseline 10), and the seven marketbots still to run it have earned their way
# from a few hundred credits to 65,012-78,226 on unpinned local missions. Fuel
# money is no longer a consideration for any of them.
#
# ---------------------------------------------------------------------------
# DELIBERATELY NOT HERE:
#   - databot — a standalone player run via cmd/databot. A worker logging in as
#     it would fight that process for the session; the same session_replaced war
#     killed a play_as pirate-7 session on 2026-08-10.
#   - random-7 — shares one game account ("Agent McAgentFace") with random-6,
#     which is actively mission-running in mission-learn. It was tolerable in the
#     capture-only idle pool; two workers both FLYING one account is the
#     session_replaced thrash that got random-7 omitted from mission-learn in the
#     first place. It needs its own account before it can join.
#   - craftsman-1 — held out on purpose. It carries ~8,868 intentional lowball
#     buy orders, and it is one of the seven agents that already HOLDS the
#     unlock. Its membership is decided in mission-learn-overrides.json.
#   - pirate-6..10 — the hunt fleet (data/overmind/hunt-fleet.yaml).
#   - explorer-3, engineer-2, engineer-5 — mission-learn members restored in the
#     overrides sidecar on 2026-08-10.
#   - empire-crimson / empire-crimson-real — spent security-test accounts, not
#     agents. The pair probed whether an empire ruler's name could be spoofed by
#     homoglyph (Cyrillic "а" vs Latin "a") and whether ruler names were reserved
#     at registration; they were not. Both bugs are fixed, so there is nothing
#     left to track and no reason to keep logging them in.
#
# `overmind` is a real agent, reserved as the eventual overmind runner once
# roles are interchangeable. cmd/overmind never logs in, so nothing contends
# for that identity while it works here.
workers:
  # === WAVE 1 — PINNED AT THE CHAIN GIVER (3 jumps) ===================
  # All four are in range and expected to bank the unlock. The two marketbots
  # hold ~250 credits each and that is not a bar: the chain supplies its own
  # cargo (see above), so their wallets only ever pay fuel over 3 jumps.
  # Fuel measured 2026-08-11: miner-1 86/150, miner-2 194/200.
  - { agent_id: miner-1, role: unlock, station: treasure_cache_trading_post, mission_categories: [smuggling, delivery, exploration] }
  - { agent_id: miner-2, role: unlock, station: treasure_cache_trading_post, mission_categories: [smuggling, delivery, exploration] }
  # DEPLOYED 2026-08-12 — both hold the unlock (smuggling 8, pirate baseline 10)
  # and have nothing left to earn at the giver. Re-pinned to the strongholds
  # they are named for, which is what this whole campaign was for: the `unlock`
  # role already runs update_market hourly, so a pinned agent AT a stronghold
  # turns a dark market into a reporting one without any further change.
  #
  # Trip is cheap: both fly Prospects (1 fuel/jump, 130 tank) so 30-32 jumps
  # costs 30-32 fuel. Thane Keep has never been scanned by anyone.
  # ⚠️ PIN WITH THE BASE ID, NOT THE POI ID. The arrival check compares
  # st.Player.DockedAtBase (a BASE id) against this field, so a POI-id pin can
  # never match at a dual-named station. Both of these were first pinned as
  # `voss_redoubt` / `thane_keep` and, though docked and capturing, read as
  # not-yet-arrived on every dry pass -- so they re-travelled to the station
  # they were standing on, 164 times for alhena, until both 130-unit tanks hit
  # ZERO. Thane Keep's fuel desk is depleted, so it could not even refill.
  - { agent_id: marketbot_alhena, role: unlock, station: voss_redoubt_station, mission_categories: [smuggling, delivery, exploration] }
  - { agent_id: marketbot_sheratan, role: unlock, station: thane_keep_station, mission_categories: [smuggling, delivery, exploration] }

  # === WAVE 2 — THE STRONGHOLD MARKETBOTS, PINNED (2026-08-12) ========
  #
  # These seven are the campaign's whole point. Each is named for the system
  # holding one of the nine pirate strongholds and is posted there in
  # mb-fleet.yaml's exclusion list — "tasked for stations they can't reach
  # yet". Nine dark markets stay dark until they hold the unlock, and four of
  # the nine warlord bases have never been scanned at all.
  #
  # WHY THE ENGINEER-5 FEAR DOES NOT APPLY TO THEM. That strand was a big hull:
  # 135 fuel needed against a 128 tank, so the origin top-up could not cover the
  # route and the autopilot departed anyway. Every one of these seven flies a
  # scale-1 starter hull, where jump fuel = ceil(scale^1.5 x speed) = speed, so
  # 1-2 per jump against a 95-130 tank. Measured 2026-08-12 (assets.db hulls,
  # catalog_ships base_speed, jump counts by BFS over knowledge.db connections,
  # validated against the server's own find_route):
  #
  #   bellatrix    Theoria     1/jump  tank 100  16 jumps =  16   margin 84
  #   zaniah       Theoria     1/jump  tank 100  16 jumps =  16   margin 84
  #   algol        Cobble      2/jump  tank 120  16 jumps =  32   margin 88
  #   barnard_44   Archimedes  2/jump  tank 130  16 jumps =  32   margin 98
  #   xamidimura   Cobble      2/jump  tank 120  18 jumps =  36   margin 84
  #   gliese_581   Threshold   1/jump  tank  95  24 jumps =  24   margin 71
  #   gsc_0008     Maul        2/jump  tank 100  27 jumps =  54   margin 46
  #
  # The tightest of them still arrives with 46 fuel to spare, and all seven are
  # docked at fuel-selling stations right now, so the origin top-up lands. The
  # distance tail that made wave 2 unpinnable is a hull property, not a jump
  # count — these hulls are simply not in that risk class.
  # UNLOCKED 2026-08-12 20:39-21:16 — all seven completed `an_introduction`, whose
  # completion text is the grant itself: "You now have enough standing with the
  # pirate network to dock at their strongholds freely." (chain_next is
  # `supply_run`, the paying work that follows.)
  #
  # WHAT THE MISSION ACTUALLY CHANGES: the pirate BASELINE, and it is bimodal.
  # Across all 151 agents in assets.db there are exactly two values — -30 for the
  # 133 still locked, and 10 for the 18 who hold it. Nothing sits in between, so
  # `baseline >= 10` (smugglingUnlocked) is an exact test, not a threshold guess.
  # Reputation is NOT the signal: it reads 10-11 either way. Do not sample only
  # unlocked agents when checking this — every one of them shows 10/10 and the
  # difference disappears.
  #
  # So they are re-pinned from the giver's station to their OWN stronghold, the
  # posting the whole campaign was for. Base ids where the bases table knows them.
  # sable_port and korr_fortress are pinned by POI id because they are two of the
  # four warlord bases NEVER SCANNED — no bases row exists to name, which is
  # exactly the case atPinnedStation's CurrentPOI check was added to survive.
  - { agent_id: marketbot_algol, role: unlock, station: dross_citadel_station, mission_categories: [smuggling, delivery, exploration] }     # Algol / Dross Citadel
  - { agent_id: marketbot_barnard_44, role: unlock, station: sable_port, mission_categories: [smuggling, delivery, exploration] }           # Barnard 44 / Sable Port (unscanned)
  - { agent_id: marketbot_bellatrix, role: unlock, station: crix_stronghold_station, mission_categories: [smuggling, delivery, exploration] } # Bellatrix / Crix Stronghold
  - { agent_id: marketbot_zaniah, role: unlock, station: mera_sanctum_station, mission_categories: [smuggling, delivery, exploration] }     # Zaniah / Mera Sanctum
  - { agent_id: marketbot_xamidimura, role: unlock, station: kael_arsenal_station, mission_categories: [smuggling, delivery, exploration] } # Xamidimura / Kael Arsenal
  - { agent_id: marketbot_gliese_581, role: unlock, station: korr_fortress, mission_categories: [smuggling, delivery, exploration] }        # Gliese 581 / Korr Fortress (unscanned)
  - { agent_id: marketbot_gsc_0008, role: unlock, station: nyx_nexus_station, mission_categories: [smuggling, delivery, exploration] }      # GSC-0008 / Nyx Nexus

