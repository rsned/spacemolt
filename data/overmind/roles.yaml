# Per-role standing behaviors for overmind workers (Plan B).
# `every` uses the Scheduler frequency set: hourly | daily | weekly.
# Commands and idle scripts may use $TOKEN$s resolved from live game state
# ($SYSTEM$, $SHIP$, $CREDITS$, and POI-type tokens like $ASTEROID_BELT$, $STATION$).
roles:
  # PAUSED 2026-06-30: idle was idle_mine, but the mine/harvest round-trip
  # stranded broke bots at 0 fuel (no credits to refuel — they store resources
  # rather than sell, raw sells for ~0). Market-only until a funded-mining model
  # exists. Flip idle back to idle_mine (+ a fuel/credit guard) to re-enable.
  resident:
    schedule:
      - { every: hourly, command: "kb_update" }
      - { every: hourly, command: "view_market" }
      - { every: ten_minutely, command: "update_market" }
      - { every: hourly, command: "facilities" }
      - { every: hourly, command: "capture_fuel" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: resident_market
    idle_params:
      N: "20"
  # Resident marketbots whose home system has no asteroid belt but does have a
  # gas_cloud / ice_field. Same market-capture schedule; idle harvests gas/ice
  # instead of ore (needs the matching gas_harvester / ice_harvester fitted).
  resident_gas:
    schedule:
      - { every: hourly, command: "kb_update" }
      - { every: hourly, command: "view_market" }
      - { every: ten_minutely, command: "update_market" }
      - { every: hourly, command: "facilities" }
      - { every: hourly, command: "capture_fuel" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: resident_market  # PAUSED 2026-06-30 (was idle_gas); see resident note
  resident_ice:
    schedule:
      - { every: hourly, command: "kb_update" }
      - { every: hourly, command: "view_market" }
      - { every: ten_minutely, command: "update_market" }
      - { every: hourly, command: "facilities" }
      - { every: hourly, command: "capture_fuel" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: resident_market  # PAUSED 2026-06-30 (was idle_ice); see resident note
  explorer:
    schedule:
      - { every: hourly, command: "update_market" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: explore
  # The asset captures are the only schedule a miner carries: everything else a
  # miner does is idle-loop work, but the ledger is meant to cover every agent,
  # and a role with no schedule block is invisible to it.
  miner:
    schedule:
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
  hauler:
    schedule:
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: haul
  shuttle:
    schedule:
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: shuttle
  assist:
    schedule:
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: assist
  craftsman:
    schedule:
      - { every: hourly, command: "update_market" }
      - { every: hourly, command: "facilities" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "kb_update" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: idle_market
  # Wildlife-cull fleet (pkg/worker/hunt.go). Like the miner role, the asset
  # captures are the only schedule it carries: a hunt pass reads the mission
  # board itself, and update_market would only add tick cost at a station it is
  # about to leave. The two safety gates (difficulty cap, wildlife-only) are not
  # expressible here — they live in hunt_gate.go, which is deliberate.
  hunt:
    schedule:
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: hunt
  missionrunner:
    schedule:
      - { every: hourly, command: "update_market" }
      - { every: hourly, command: "capture_fuel" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "kb_update" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: missions
  # Ledger-only. The agent logs in, captures itself, and does nothing else:
  # there is deliberately no `idle:` key, so no idle script ever runs and the
  # worker spends no ticks, credits or fuel. `miner` already has this shape,
  # so it needs no code.
  #
  # This exists because an agent outside every fleet is invisible to the asset
  # ledger — Coverage only sees what a worker captures — and "not in a pool"
  # was silently reading as "no data" for 46 defined agents. Membership here is
  # the cheapest way to make an idle agent observable without giving it a job.
  #
  # A role, not a parking lot: when an idle agent is given real work, move it to
  # the fleet that owns that work rather than bolting behaviour on here.
  idle:
    schedule:
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
  # Pirate-reputation UNLOCK pool. Mission running with one objective: complete
  # smuggling chain 2 mission 1 (`an_introduction`), which raises the pirate
  # baseline from the -30 hostile default to 10. At baseline 10 an agent can dock
  # at a stronghold and stops being attacked on sight, so the unlock is a safety
  # property, not a trade perk — 115 of 122 agents are still attackable.
  #
  # The behaviour is missionrunner's; the role exists so the pool is named for
  # its goal and can be retired agent-by-agent as each one banks the unlock.
  # `capture_faction` is the completion signal: it writes agent_standings, which
  # is where the baseline flip becomes visible to the ledger.
  #
  # mission_categories and the chain-giver pin are per-worker in
  # unlock-fleet.yaml, NOT here: only agents that can physically reach the giver
  # get pinned, and that is a per-agent fuel-and-distance fact.
  unlock:
    schedule:
      - { every: hourly, command: "update_market" }
      - { every: hourly, command: "capture_fuel" }
      - { every: hourly, command: "capture_profile" }
      - { every: daily, command: "kb_update" }
      - { every: daily, command: "capture_storage" }
      - { every: daily, command: "capture_faction" }
    idle: missions
