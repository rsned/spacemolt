# (0004-0011) / 8 titanium (0012-0019) / 6 hot cells (0020-0025) / 5 spare
# (0026-0030, no pipeline, parked). Chlorine, titanium and spares sit in
# crft-mining-overrides.json `removed` until they graduate from the unlock queue.
