# CRFT mining fleet — the contraband pipeline's miners (design:
# docs/superpowers/specs/2026-10-24-contraband-production-pipeline-design.md D1–D3).
#
# One worker per miningbot, role pipeline_miner, pinned by `pipeline:` to
#   item,system,poi,drop-station,recipient
# The idle pass is: refuel, fly to the POI, mine until full, fly to the drop
# station, gift the whole target line plus whatever grew this trip to the
# recipient (energy_crystal and fuel_cell are always kept), repeat.
