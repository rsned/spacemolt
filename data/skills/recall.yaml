name: recall
description: Return agent to empire capital system and dock at the station

parameters: []

prerequisites: []

steps:
  - id: check_already_home
    check: true
    conditions:
      at_system(capital_system_id) AND at_poi_type(station) AND docked: goto done
      at_system(capital_system_id) AND docked: goto undock_wrong_poi
      at_system(capital_system_id): goto find_station
      default: goto prepare_travel

  - id: undock_wrong_poi
    action: undock
    next: find_station

  - id: find_station
    check: true
    conditions:
      at_poi_type(station): goto dock_at_station
      default: goto travel_to_station

  - id: travel_to_station
    action: find_poi_in_system
    target: station
    next: go_to_station

  - id: go_to_station
    action: travel
    target: $found_poi
    next: dock_at_station

  - id: dock_at_station
    action: dock
    next: done

  - id: prepare_travel
    check: true
    conditions:
      docked: goto undock
      default: goto travel_home

  - id: undock
    action: undock
    next: travel_home

  - id: travel_home
    skill: travel
    skill_params:
      destination_system: $capital_system_id
    next: find_station

  - id: done
    terminal: true
