name: craft_items
description: >
  Craft all possible items from station storage and ship cargo. Deposits cargo
  to storage first, queries the crafting MCP server for craftable recipes from
  the combined pool, withdraws materials, crafts in batches, and deposits
  results. Repeats until nothing more can be crafted. Must be docked at a station.

prerequisites:
  - docked
  - at_poi_type(station)

steps:
  - id: check_ready
    check: true
    conditions:
      not docked: goto done
      not at_poi_type(station): goto done
      default: goto craft

  - id: craft
    action: craft_items
    next: done

  - id: done
    terminal: true
