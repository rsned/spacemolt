name: scan_for_distress
description: >
  Continuously announce shipside assistance to the system channel (hourly),
  then scan all chat channels for distress requests. If found, invoke
  assist_deliver sub-skill to deliver supplies. Sleeps 5 minutes between
  scan cycles and loops indefinitely.

parameters:
  - name: service_name
    description: >
      Display name of the rescue service from the agent's personality
      (e.g. "Frontier Rescue Service", "Nebula Emergency Bureau").
    required: true

prerequisites: []

background_slot:
  description: "Mine or harvest resources during 5-minute scan sleep intervals"
  interrupt: graceful
  cleanup_outputs:
    - docked
  idle_steps:
    - sleep_cycle
  min_idle_duration: 60

steps:
  - id: check_announce_cooldown
    check: true
    description: >
      Check if at least 1 hour has elapsed since the last service
      announcement. Avoids spamming the system channel.
    conditions:
      last_announce_age >= 3600: goto announce_services
      default: goto scan_chats

  - id: announce_services
    action: chat
    args:
      channel: system
      content: "$service_name reporting for duty! Shipside assistance is available — if you're out of fuel or need repairs, send us a message and we'll be right there! Only available in capital systems currently. Donations are always welcome."
    next: scan_chats

  - id: scan_chats
    action: scan_chat_for_distress
    next: check_found

  - id: check_found
    check: true
    description: >
      Check if scan_chat_for_distress found a matching distress message.
      If so, invoke assist_deliver sub-skill to handle the request.
    conditions:
      found_request: goto deliver_supplies
      default: goto sleep_cycle

  - id: deliver_supplies
    skill: assist_deliver
    skill_params:
      requester_id: $requester_id
      requester_name: $requester_name
      request_type: $request_type
      target_poi: $requester_poi
    next: sleep_cycle

  - id: sleep_cycle
    action: sleep_scan_interval
    next: check_announce_cooldown
