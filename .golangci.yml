version: "2"

linters:
  enable:
    - govet          # Standard Go vet checks
    - staticcheck    # Advanced static analysis
    - ineffassign    # Detect ineffectual assignments
    - unused         # Detect unused code
    - errcheck       # Check for unchecked errors
    - bodyclose      # Check for unclosed HTTP response bodies
    - nilerr         # Find nil error returns

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct padding; reordering fields hurts readability

    staticcheck:
      # staticcheck's own default: everything except the naming/comment style rules
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  exclusions:
    paths:
      - frontend/node_modules

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
