<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacemolt Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #0a0a0f; color: #c0c0d0; }
    .header { background: #12121a; padding: 16px 24px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; color: #e0e0f0; }
    .header .status { font-size: 12px; color: #60d060; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; padding: 24px; }
    .card { background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 16px; }
    .card h2 { font-size: 14px; color: #8080a0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a1a2a; }
    .stat:last-child { border-bottom: none; }
    .stat .label { color: #8080a0; }
    .stat .value { color: #e0e0f0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: #8080a0; font-weight: 500; padding: 8px 6px; border-bottom: 1px solid #2a2a3a; }
    td { padding: 8px 6px; border-bottom: 1px solid #1a1a2a; }
    .full-width { grid-column: 1 / -1; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.green { background: #60d060; }
    .dot.yellow { background: #d0d060; }
    .dot.red { background: #d06060; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Spacemolt Admin</h1>
    <span class="status" id="status">connecting...</span>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Server</h2>
      <div id="server-stats"></div>
    </div>
    <div class="card">
      <h2>LLM Health</h2>
      <div id="llm-stats"></div>
    </div>
    <div class="card">
      <h2>Knowledge Base</h2>
      <div id="kb-stats"></div>
    </div>
    <div class="card full-width">
      <h2>Agents</h2>
      <table>
        <thead>
          <tr><th>Agent</th><th>Type</th><th>Strategy</th><th>Status</th><th>System</th><th>Actions</th><th>Errors</th></tr>
        </thead>
        <tbody id="agents-table"></tbody>
      </table>
    </div>
  </div>
  <script>
    function fmt(d) { return d !== undefined && d !== null ? d : '-'; }
    function fmtDur(ms) { return ms > 0 ? (ms / 1e6).toFixed(0) + 'ms' : '-'; }
    function fmtUptime(ns) {
      const s = Math.floor(ns / 1e9);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return h + 'h ' + m + 'm';
    }
    function stat(label, value) {
      return '<div class="stat"><span class="label">' + label + '</span><span class="value">' + value + '</span></div>';
    }

    async function poll() {
      try {
        const res = await fetch('/api/admin/metrics');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        document.getElementById('status').textContent = 'live';
        document.getElementById('status').style.color = '#60d060';

        const sv = data.server || {};
        document.getElementById('server-stats').innerHTML =
          stat('Uptime', fmtUptime(sv.uptime_seconds)) +
          stat('Goroutines', fmt(sv.goroutines)) +
          stat('Heap', (sv.heap_alloc_mb || 0).toFixed(1) + ' MB') +
          stat('Total Agents', fmt(sv.total_agents)) +
          stat('LLM Agents', fmt(sv.llm_agents)) +
          stat('Strategy Agents', fmt(sv.strategy_agents));

        const llm = data.llm || {};
        document.getElementById('llm-stats').innerHTML =
          stat('Avg Latency', fmtDur(llm.avg_latency_ms)) +
          stat('P99 Latency', fmtDur(llm.p99_latency_ms)) +
          stat('Error Rate', (llm.error_rate || 0).toFixed(2) + '%') +
          stat('Req/min', fmt(llm.requests_per_min)) +
          stat('Total Calls', fmt(llm.total_calls));

        const kb = data.kb || {};
        document.getElementById('kb-stats').innerHTML =
          stat('Systems', fmt(kb.systems)) +
          stat('POIs', fmt(kb.pois)) +
          stat('Bases', fmt(kb.bases)) +
          stat('Items', fmt(kb.items));

        const agents = data.agents || [];
        const tbody = document.getElementById('agents-table');
        if (agents.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="color:#606070;text-align:center;">No agents running</td></tr>';
        } else {
          tbody.innerHTML = agents.map(function(a) {
            const dot = a.errors_total > 0 ? 'red' : 'green';
            return '<tr>' +
              '<td><span class="dot ' + dot + '"></span>' + a.agent_id + '</td>' +
              '<td>' + fmt(a.type) + '</td>' +
              '<td>' + fmt(a.strategy) + '</td>' +
              '<td>' + fmt(a.status) + '</td>' +
              '<td>' + fmt(a.system) + '</td>' +
              '<td>' + fmt(a.actions_total) + '</td>' +
              '<td>' + fmt(a.errors_total) + '</td>' +
              '</tr>';
          }).join('');
        }
      } catch (e) {
        document.getElementById('status').textContent = 'disconnected';
        document.getElementById('status').style.color = '#d06060';
      }
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
