<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-collective {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-collective-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Collective Empire Symbol - Hexagonal hive pattern -->
  <g class="empire-collective">
    <!-- Central hexagon -->
    <path d="M50 30 L65 40 L65 60 L50 70 L35 60 L35 40 Z" class="empire-collective-filled" opacity="0.1"/>
    <path d="M50 30 L65 40 L65 60 L50 70 L35 60 L35 40 Z"/>

    <!-- Surrounding hexagons -->
    <path d="M35 25 L50 15 L65 25"/>
    <path d="M65 40 L80 30 L80 50"/>
    <path d="M65 60 L80 70 L80 50"/>
    <path d="M35 60 L20 70 L20 50"/>
    <path d="M35 40 L20 30 L20 50"/>
    <path d="M35 25 L20 30"/>

    <!-- Central node -->
    <circle cx="50" cy="50" r="8"/>
    <circle cx="50" cy="50" r="4" class="empire-collective-filled"/>

    <!-- Connection nodes -->
    <circle cx="50" cy="25" r="3" class="empire-collective-filled"/>
    <circle cx="65" cy="40" r="3" class="empire-collective-filled"/>
    <circle cx="65" cy="60" r="3" class="empire-collective-filled"/>
    <circle cx="50" cy="75" r="3" class="empire-collective-filled"/>
    <circle cx="35" cy="60" r="3" class="empire-collective-filled"/>
    <circle cx="35" cy="40" r="3" class="empire-collective-filled"/>
  </g>
</svg>