<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-federation {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-federation-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Federation Empire Symbol - Hexagon with Y internal -->
  <g class="empire-federation">
    <!-- Outer hexagon -->
    <path d="M50 20 L70 30 L70 60 L50 75 L30 60 L30 30 Z" class="empire-federation-filled" opacity="0.1"/>
    <path d="M50 20 L70 30 L70 60 L50 75 L30 60 L30 30 Z"/>

    <!-- Inner Y pattern -->
    <line x1="50" y1="35" x2="50" y2="55"/>
    <line x1="50" y1="45" x2="35" y2="55"/>
    <line x1="50" y1="45" x2="65" y2="55"/>

    <!-- Center circle -->
    <circle cx="50" cy="50" r="6" class="empire-federation-filled"/>
  </g>
</svg>