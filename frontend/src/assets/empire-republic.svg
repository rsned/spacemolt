<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-republic {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-republic-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Republic Empire Symbol - Laurel wreath style -->
  <g class="empire-republic">
    <!-- Outer ring -->
    <circle cx="50" cy="50" r="35" class="empire-republic-filled" opacity="0.1"/>
    <circle cx="50" cy="50" r="35"/>

    <!-- Inner laurel leaves -->
    <path d="M50 20 Q65 25 65 35"/>
    <path d="M50 20 Q35 25 35 35"/>
    <path d="M65 35 Q75 40 75 50"/>
    <path d="M35 35 Q25 40 25 50"/>
    <path d="M75 50 Q70 60 65 65"/>
    <path d="M25 50 Q30 60 35 65"/>
    <path d="M65 65 Q55 75 50 80"/>
    <path d="M35 65 Q45 75 50 80"/>

    <!-- Central seal -->
    <circle cx="50" cy="50" r="15"/>
    <path d="M50 40 L55 47 L50 55 L45 47 Z" class="empire-republic-filled"/>
  </g>
</svg>