<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-nebula-collective {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-nebula-collective-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Nebula Collective - 4-point compass with circle and star -->
  <g class="empire-nebula-collective">
    <!-- Main compass cross -->
    <line x1="50" y1="15" x2="50" y2="85"/>
    <line x1="15" y1="50" x2="85" y2="50"/>

    <!-- Outer circle -->
    <circle cx="50" cy="50" r="30" class="empire-nebula-collective-filled" opacity="0.1"/>
    <circle cx="50" cy="50" r="30"/>

    <!-- Small circle in bottom left quadrant -->
    <circle cx="35" cy="65" r="8" class="empire-nebula-collective-filled"/>

    <!-- Small star in upper right quadrant -->
    <g transform="translate(65, 35)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" class="empire-nebula-collective-filled"/>
    </g>

    <!-- Center point -->
    <circle cx="50" cy="50" r="3" class="empire-nebula-collective-filled"/>
  </g>
</svg>