<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-syndicate {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-syndicate-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Syndicate Empire Symbol - Pentagon with star internal -->
  <g class="empire-syndicate">
    <!-- Outer pentagon -->
    <path d="M50 20 L75 40 L65 70 L35 70 L25 40 Z" class="empire-syndicate-filled" opacity="0.1"/>
    <path d="M50 20 L75 40 L65 70 L35 70 L25 40 Z"/>

    <!-- Inner star -->
    <path d="M50 35 L55 45 L65 45 L57 52 L60 62 L50 55 L40 62 L43 52 L35 45 L45 45 Z"/>

    <!-- Center dot -->
    <circle cx="50" cy="50" r="4" class="empire-syndicate-filled"/>
  </g>
</svg>