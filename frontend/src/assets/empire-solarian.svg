<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-solarian {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-solarian-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Solarian Empire - Star/sun icon -->
  <g class="empire-solarian">
    <!-- Central sun circle -->
    <circle cx="50" cy="50" r="15" class="empire-solarian-filled" opacity="0.2"/>
    <circle cx="50" cy="50" r="15"/>

    <!-- Sun rays - 8 points -->
    <line x1="50" y1="20" x2="50" y2="30"/>
    <line x1="50" y1="70" x2="50" y2="80"/>
    <line x1="20" y1="50" x2="30" y2="50"/>
    <line x1="70" y1="50" x2="80" y2="50"/>

    <!-- Diagonal rays -->
    <line x1="29" y1="29" x2="36" y2="36"/>
    <line x1="71" y1="29" x2="64" y2="36"/>
    <line x1="29" y1="71" x2="36" y2="64"/>
    <line x1="71" y1="71" x2="64" y2="64"/>

    <!-- Center glow -->
    <circle cx="50" cy="50" r="6" class="empire-solarian-filled"/>
  </g>
</svg>