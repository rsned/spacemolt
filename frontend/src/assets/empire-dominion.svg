<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-dominion {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-dominion-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Dominion Empire Symbol - Triangle with internal structure -->
  <g class="empire-dominion">
    <!-- Outer triangle -->
    <path d="M50 15 L80 70 L20 70 Z" class="empire-dominion-filled" opacity="0.1"/>
    <path d="M50 15 L80 70 L20 70 Z"/>

    <!-- Inner triangle -->
    <path d="M50 30 L70 60 L30 60 Z"/>

    <!-- Center element -->
    <circle cx="50" cy="50" r="8" class="empire-dominion-filled"/>
  </g>
</svg>