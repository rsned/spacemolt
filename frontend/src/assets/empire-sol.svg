<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .empire-sol {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empire-sol-filled {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </defs>
  <!-- Sol Empire Symbol - Circle with internal cross pattern -->
  <g class="empire-sol">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="35" class="empire-sol-filled" opacity="0.1"/>
    <circle cx="50" cy="50" r="35"/>

    <!-- Inner circle -->
    <circle cx="50" cy="50" r="20"/>

    <!-- Cross pattern -->
    <line x1="35" y1="50" x2="65" y2="50"/>
    <line x1="50" y1="35" x2="50" y2="65"/>

    <!-- Center dot -->
    <circle cx="50" cy="50" r="5" class="empire-sol-filled"/>
  </g>
</svg>